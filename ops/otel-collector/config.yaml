receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
  resource/clean:
    attributes:
      - key: process.pid
        action: delete
      - key: process.command
        action: delete
      - key: process.command_args
        action: delete
      - key: process.executable.path
        action: delete
      - key: process.owner
        action: delete
      - key: host.id
        action: delete
      - key: host.name
        action: delete

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: nova
    send_timestamps: true
    resource_to_telemetry_conversion:
      enabled: true
  otlphttp/loki:
    endpoint: http://loki:3100/otlp

extensions:
  zpages:
    endpoint: 0.0.0.0:55679

service:
  extensions: [zpages]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource/clean, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [resource/clean, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [resource/clean, batch]
      exporters: [otlphttp/loki]
